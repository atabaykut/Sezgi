# Sezgi karşılaştırma eylemi: PR'da taban commit'in ve PR'ın haritasını kurar, karşılaştırır. Bağlı yapay zekâları ve
# entegrasyonları bozacak değişiklikte (kaldırılan işlem, yeni zorunlu girdi, daralan değerler, sıkılaşan sınırlar,
# yeni giriş zorunluluğu, kısıtlanan roller) iş başarısız olur; özet adım özetine ve PR'a yorum olarak yazılır.
# Örnek iş akışı: eylem/ornek-is-akisi.yml. Eylem başka bir eylem çağırmaz; yalnızca kabuk, git ve gh kullanır.
name: Sezgi AI Contract Check
description: "Fails a PR that breaks what your app exposes to AI agents: removed operations, new required inputs, new login rules."
author: Sezgi
branding:
  icon: shield
  color: blue
inputs:
  uygulama:
    description: "App folder, relative to the repository root (Uygulamanın depo köküne göre klasörü)"
    default: "."
  taban:
    description: "Base commit to compare against; empty means the PR's base (Karşılaştırılacak eski commit)"
    default: ""
  sert:
    description: "true: fail the job on a breaking change; false: report only (bozan değişiklikte iş başarısız olur)"
    default: "true"
  yorum:
    description: "true: post the summary as one PR comment, updated on each run; needs pull-requests: write (özet PR'a yorum olarak yazılır)"
    default: "true"
  sezgi-surumu:
    description: "Sezgi version; the binary is downloaded from the GitHub release and checked with SHA-256, npm is the fallback (Sezgi sürümü)"
    default: "0.1.4"
  sezgi:
    description: "Path to an installed sezgi binary; when set nothing is downloaded (Kurulu sezgi ikilisinin yolu)"
    default: ""
  github-token:
    description: "Token used for the PR comment (PR yorumu için belirteç)"
    default: ${{ github.token }}
outputs:
  kirilma:
    description: "true: a breaking change was found (bozan değişiklik var)"
    value: ${{ steps.karsilastir.outputs.kirilma }}
runs:
  using: composite
  steps:
    - id: karsilastir
      shell: bash
      env:
        SEZGI_UYGULAMA: ${{ inputs.uygulama }}
        SEZGI_TABAN: ${{ inputs.taban || github.event.pull_request.base.sha }}
        SEZGI_SERT: ${{ inputs.sert }}
        SEZGI_YORUM: ${{ inputs.yorum }}
        SEZGI_SURUM: ${{ inputs.sezgi-surumu }}
        SEZGI_IKILI: ${{ inputs.sezgi }}
        SEZGI_PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/eylem/karsilastir.sh"
