# `sezgi add mcp` için bilinen yapay zekâ araçları: MCP sunucusu listesini hangi dosyada, hangi biçimde tuttukları.
# Katkıya açık bir listedir: yeni bir araç bir [[arac]] bloğuyla eklenir. Listede olmayan araçlar için
# `sezgi add mcp` genel bağlantı bilgisini (komut ve argümanlar) yazdırır.
#
# Yol yer tutucuları:
#   {proje}  uygulama klasörü          {ev}     kullanıcı klasörü (USERPROFILE / HOME)
#   {ayar}   kullanıcı ayar klasörü: Windows'ta APPDATA, macOS'ta ~/Library/Application Support,
#            diğerlerinde XDG_CONFIG_HOME ya da ~/.config
# kapsam: "proje" yalnızca bu uygulamayı etkiler; "genel" bütün projeleri etkiler (ayrıca uyarılır).
# bicim:  "json"  dosyadaki <kok> nesnesine { "<ad>": { "command", "args" } } eklenir (tip varsa "type" de yazılır)
#         "codex-toml"  dosyanın sonuna [mcp_servers.<ad>] bloğu eklenir
# belirti: aracın bu bilgisayarda kurulu olduğunu gösteren klasörler ya da PATH'teki komutlar ("komut:ad").
# talimat: yönlendirme satırının ekleneceği, aracın okuduğu talimat dosyası (proje kökünde).

[[arac]]
kimlik = "claude-code"
ad = "Claude Code"
kapsam = "proje"
dosya = "{proje}/.mcp.json"
bicim = "json"
kok = "mcpServers"
belirti = ["komut:claude", "{ev}/.claude"]
talimat = "CLAUDE.md"

