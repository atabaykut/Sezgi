name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Sürüm iş akışı (release.yml) önce bunu çağırır: CI geçmeden hiçbir şey derlenmez
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS iki mimaride: macos-14 Apple Silicon (arm64), macos-15-intel x86_64
        os: [ubuntu-latest, macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - name: macOS en düşük sürümü
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo build --release --locked
      # macOS duman testi: küçük bir Express uygulaması haritalanır, doktor çalışır; canlı modda insan oturumu ve kayıt
      # anahtarı Anahtar Zinciri'ne yazılır (dosyaya değil) ve yeni bir süreçte geri okunur (kayıt zinciri çözülür).
      # Sezgi yapılandırması geçici klasörde (XDG_CONFIG_HOME); oturum sonunda kapatılır (anahtarlık girdisi silinir).
      # Çıktı Türkçe aranır: runner'ın sistem dili (en_US) yerine SEZGI_LANG=tr.
      - name: macOS duman testi (harita, doktor, Anahtar Zinciri)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SEZGI_LANG: tr
        run: |
          set -euo pipefail
          B="$PWD/target/release/sezgi"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/sezgi-ayar"
          A="$RUNNER_TEMP/duman"
          mkdir -p "$A" && cd "$A"
          echo '{"name":"duman","dependencies":{"express":"^4.21.0"}}' > package.json
          cat > app.js <<'EOF'
          const express = require("express");
          const app = express();
          app.get("/saglik", (req, res) => res.json({ ok: true }));
          app.post("/kitaplar", (req, res) => res.status(201).json(req.body));
          app.listen(3000);
          EOF
          "$B" --version
          "$B" init .
          grep -q '"GET /saglik"' .sezgi/kapilar.json && grep -q '"POST /kitaplar"' .sezgi/kapilar.json
          "$B" doktor .
          "$B" hedef http://127.0.0.1:9 --test-kopyasi
          "$B" mod okuma
          cikti="$(echo OTURUM-DUMAN | "$B" oturum ac 2>&1)"; echo "$cikti"
          echo "$cikti" | grep -q "işletim sistemi anahtarlığında" || { echo "✗ oturum Anahtar Zinciri'ne yazılmadı"; exit 1; }
          durum="$(ls -d "$XDG_CONFIG_HOME"/sezgi/uygulamalar/*)"
          grep -q '"anahtarlik":true' "$durum/oturum.json" && ! grep -q OTURUM-DUMAN "$durum/oturum.json" || { echo "✗ oturum dosyada"; exit 1; }
          [ ! -e "$durum/kayit.anahtar" ] || { echo "✗ kayıt anahtarı Anahtar Zinciri yerine dosyada"; exit 1; }
          "$B" kayit --dogrula | tee /dev/stderr | grep -q "sağlam"
          "$B" oturum kapat

  # Test katmanı (testler/): bütünleşik testler, örnek uygulamalar, birim ve özellik testleri. Linux'ta koşar: sahte
  # terminal testleri `script` (util-linux) ister, Ayna tarayıcı testleri başsız Chrome ister (runner'da kurulu; kum havuzu
  # runner'ın kullanıcı ad alanı kısıtı yüzünden yalnızca bu test tarayıcısı için kapatılır).
  testler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - name: Başsız tarayıcı
        shell: bash
        run: |
          set -euo pipefail
          krom="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$krom" > "$RUNNER_TEMP/tarayici"
          chmod +x "$RUNNER_TEMP/tarayici"
          echo "SEZGI_TARAYICI=$RUNNER_TEMP/tarayici" >> "$GITHUB_ENV"
      - name: Testlerle clippy
        run: SEZGI_KOMUT=clippy bash testler/calistir.sh --all-targets -- -D warnings
      # Gerçek veri testleri insan çapasını kurar (`sezgi insan kur --sistem`): çapa kök sahipli olmalı, bu yüzden test
      # katmanı yerel Docker ortamındaki gibi kök kullanıcıyla koşar. Clippy önce çalışır: kökün yazdığı derleme
      # klasörüne normal kullanıcı yazamaz.
      - name: Testler
        run: sudo -E env "PATH=$PATH" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" bash testler/calistir.sh --no-fail-fast

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Lisans, RustSec güvenlik açığı ve kaynak denetimi (deny.toml)
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  # RustSec güvenlik açığı denetimi (cargo-deny'ın advisories denetimine ek olarak): sabit sürümlü cargo-audit
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  # README'lerdeki ölçüm sayıları kaynak dosyalarıyla (kanit/) aynı olmalı
  belgeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node kanit/belge-tutarlilik.js
